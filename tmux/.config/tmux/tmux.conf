# prefix: C-a (like screen, more ergonomic than C-b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# true color + italics
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"

# quality of life
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -s escape-time 0
set -g focus-events on

# vi mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -sel clip -i"
bind -T copy-mode-vi Escape send -X cancel

# splits (keep current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# pane navigation (vim-style com prefix)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# pane navigation sem prefix (Alt+hjkl)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# window navigation sem prefix (Alt+n/p ou Alt+1..9)
bind -n M-n next-window
bind -n M-p previous-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# toggle last window (perdido ao rebindar 'l' pra select-pane)
bind Tab last-window

# pane resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# docker dev preset: Claude/agent grande no topo + logs do container embaixo (30%)
bind D split-window -v -l 30% -c "#{pane_current_path}" \; select-pane -t 1

# sessionizer: popup fzf sobre ~/repo, cria/pula pra session por projeto
bind o display-popup -E "~/.config/tmux/tmux-sessionizer"

# reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# status bar — Catppuccin Mocha (synced with ghostty/alacritty)
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=#6c7086] %H:%M  %d/%m "
set -g status-right-length 40
setw -g window-status-format "#[fg=#6c7086] #I:#W "
setw -g window-status-current-format "#[bg=#89b4fa,fg=#1e1e2e,bold] #I:#W "
set -g mode-style "bg=#89b4fa,fg=#1e1e2e"

# pane border
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"

# === plugins (tpm) ===
# plugins live OUTSIDE the dotfile repo (this dir is a stow symlink)
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# resurrect: save layout + scrollback contents on save/restore
set -g @resurrect-capture-pane-contents 'on'
# continuum: auto-save a cada 15min + auto-restore ao subir o server
set -g @continuum-restore 'on'

# manter na ÚLTIMA linha do arquivo
run "$HOME/.local/share/tmux/plugins/tpm/tpm"
