# Catppuccin Mocha — synced with ghostty/alacritty/tmux
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
continuation_prompt = "[▸▹ ](dimmed white)"

palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

# linha 1: git metrics + duração | linha 2: prompt
format = """($git_metrics\n)$cmd_duration$jobs$sudo$username$character"""

right_format = "$directory$custom.mise$custom.tmux$git_branch$git_state$git_status$docker_context$elixir$erlang$golang$php$nodejs$python$rust$battery$time"

# ── prompt ────────────────────────────────────────────────────────────────────

[character]
format = "$symbol "
success_symbol = "[◎](bold italic yellow)"
error_symbol = "[○](italic mauve)"
vimcmd_symbol = "[■](italic dimmed green)"

[directory]
home_symbol = "⌂"
truncation_length = 2
truncation_symbol = "…/"
read_only = " ◈"
style = "italic blue"
format = ' [$path]($style)[$read_only]($read_only_style)'
repo_root_format = '[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) [△](bold blue)'

[cmd_duration]
min_time = 2_000
format = "[◄ $duration ](italic subtext0)"
show_notifications = false

[jobs]
format = "[$symbol$number]($style) "
style = "subtext0"
symbol = "[▶](blue italic)"

[sudo]
format = "[$symbol]($style)"
style = "bold italic mauve"
symbol = "⋈"
disabled = false

[username]
style_user = "yellow bold italic"
style_root = "mauve bold italic"
format = "[⭘ $user]($style) "
show_always = false

[time]
format = "[ $time]($style)"
time_format = "%R"
style = "italic subtext0"

[battery]
format = "[$percentage$symbol]($style)"
full_symbol = " █"
charging_symbol = " ↑"
discharging_symbol = " ↓"

[[battery.display]]
threshold = 20
style = "bold red"

[[battery.display]]
threshold = 60
style = "italic subtext0"

# ── git ───────────────────────────────────────────────────────────────────────

[git_branch]
format = " [$branch(:$remote_branch)]($style)"
symbol = "[△](bold italic blue)"
style = "italic blue"
truncation_length = 11
ignore_branches = ["main", "master"]
only_attached = true

[git_metrics]
format = '([▴$added]($added_style))([▿$deleted]($deleted_style)) '
added_style = 'italic dimmed green'
deleted_style = 'italic dimmed red'
ignore_submodules = true

[git_state]
style = "italic peach"

[git_status]
style = "bold italic blue"
format = "([⎪$ahead_behind$staged$modified$untracked$conflicted$stashed⎥]($style))"
ahead = "[▴${count}](green)"
behind = "[▿${count}](red)"
diverged = "[◇▴${ahead_count}▿${behind_count}](mauve)"
untracked = "[◌](yellow)"
stashed = "[◃](subtext0)"
modified = "[●](yellow)"
staged = "[▪${count}](teal)"
conflicted = "[◪](mauve)"

# ── linguagens (mise stack) ───────────────────────────────────────────────────

[elixir]
symbol = "△ "
format = "[$symbol($version · OTP $otp_version)]($style)"
style = "bold mauve"

[erlang]
symbol = "⚡ "
format = "[$symbol$version]($style)"
style = "bold red"

[golang]
symbol = "go "
format = "[$symbol$version]($style)"
style = "bold teal"

[php]
symbol = "php "
format = "[$symbol$version]($style)"
style = "bold lavender"

[nodejs]
symbol = "node "
format = "[$symbol$version]($style)"
style = "bold green"
detect_files = ["package.json", "pnpm-lock.yaml", "package-lock.json", "yarn.lock", "bun.lock"]
detect_folders = ["node_modules"]

[python]
symbol = "py "
format = "[$symbol$version]($style)"
style = "bold yellow"

[rust]
symbol = "rs "
format = "[$symbol$version]($style)"
style = "bold peach"

# ── infra (aparece só quando relevante) ──────────────────────────────────────

[docker_context]
symbol = "◧ "
format = "[$symbol$context]($style)"
style = "bold blue"
only_with_files = true

# ── custom ────────────────────────────────────────────────────────────────────

[custom.mise]
description = "mise env ou pins locais"
shell = ["bash", "-c"]
command = '''
if [[ -n "${MISE_ENV:-}" ]]; then
  printf '%s' "$MISE_ENV"
  exit 0
fi
mise ls --current 2>/dev/null \
  | awk '$3 !~ /\/\.config\/mise\/config\.toml$/ && $2 !~ /\(missing\)/ {
      split($2, v, " "); printf "%s@%s ", $1, v[1]
    }' \
  | sed 's/ $//'
'''
when = "bash -c '[[ -n \"${MISE_ENV:-}\" ]] || [[ -f mise.toml || -f .mise.toml || -f .tool-versions ]]'"
format = " [$symbol$output]($style)"
symbol = "⬢ "
style = "bold peach"
ignore_timeout = true

[custom.tmux]
description = "sessão tmux ativa"
command = "tmux display-message -p '#S'"
when = "test -n \"${TMUX:-}\""
format = " [$symbol$output]($style)"
symbol = "◧ "
style = "italic surface2"
ignore_timeout = true
