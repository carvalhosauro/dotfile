[font]
size = 12.5

normal = { family = "FiraCode Nerd Font Propo", style = "Regular" }
bold = { family = "FiraCode Nerd Font Propo", style = "Bold" }
italic = { family = "Victor Mono", style = "Italic" }
bold_italic = { family = "Victor Mono", style = "Bold Italic" }

offset = { x = 0, y = 0 }
glyph_offset = { x = 0, y = 0 }

[colors]
draw_bold_text_with_bright_colors = true

# Catppuccin Mocha — synced with ghostty/.config/ghostty/config
[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"

[colors.cursor]
text = "#1e1e2e"
cursor = "#f5e0dc"

[colors.selection]
text = "#cdd6f4"
background = "#45475a"

[colors.normal]
black   = "#45475a"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#f5c2e7"
cyan    = "#94e2d5"
white   = "#bac2de"

[colors.bright]
black   = "#585b70"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#f5c2e7"
cyan    = "#94e2d5"
white   = "#a6adc8"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
